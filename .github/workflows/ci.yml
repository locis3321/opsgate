name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 必须在 setup-node 之前安装：setup-node 的 cache: pnpm 会调用 pnpm 定位 store
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run check:redlines
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --dir frontend run build
